[project]
name = "consentshield"
version = "0.1.0"
description = "Consent gate between a screen-watching personal agent and the cloud"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=11",
    "laya==0.3.4",
    "torch==2.7.0",
    "mcp>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120
